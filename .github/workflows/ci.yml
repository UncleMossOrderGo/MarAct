name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgres://maract:maract@127.0.0.1:55432/maract
  OPENAI_API_KEY: ""
  IDEA_A_USE_SEED_TRENDS: "true"
  IDEA_A_SCHEDULER_ENABLED: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ideas: ${{ steps.scope.outputs.ideas }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci_plan "$BASE" "$HEAD"

  ideas:
    needs: plan
    if: needs.plan.outputs.ideas != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idea: ${{ fromJSON(needs.plan.outputs.ideas) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: make db migrate
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-idea
        env:
          IDEA: ${{ matrix.idea }}

  shared:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: make quality
      - run: make db migrate
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:web -- tests/
      - if: github.event_name == 'push'
        run: make build

  ci:
    needs: [plan, ideas, shared]
    if: always()
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.plan.result }}
      IDEAS: ${{ needs.ideas.result }}
      SHARED: ${{ needs.shared.result }}
      EXPECT_IDEAS: ${{ needs.plan.outputs.ideas != '[]' }}
      EXPECT_SHARED: ${{ needs.plan.outputs.full }}
    steps:
      - run: |
          set -eu
          test "$PLAN" = success
          if [ "$EXPECT_IDEAS" = true ]; then test "$IDEAS" = success; else test "$IDEAS" = skipped; fi
          if [ "$EXPECT_SHARED" = true ]; then test "$SHARED" = success; else test "$SHARED" = skipped; fi
